services:
  db:
    image: postgres:15-alpine
    container_name: music_rights_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: music_rights_ai
    ports:
      # Cổng host mặc định 5433 để không đụng PostgreSQL đã cài sẵn trên máy
      # (máy dev hiện tại đang chạy PostgreSQL 18 ở cổng 5432).
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_rights_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music_rights_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Trong mạng nội bộ của compose thì host là "db" và cổng luôn là 5432.
      # Biến này giờ ĐƯỢC code đọc thật qua backend/config.py — trước đây nó bị
      # bỏ qua vì chuỗi kết nối bị hardcode trong từng file.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/music_rights_ai
    volumes:
      - ./temp_uploads:/app/temp_uploads
      # Mount dữ liệu tham chiếu để không phải build lại image khi rebuild index
      - ./data:/app/data

volumes:
  postgres_data:
